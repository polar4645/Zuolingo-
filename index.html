<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuolingo</title>
<style>
:root{--bg:#eaf2ff;--card:#fff;--tx:#2b2d42;--b1:#0f5ff0;--b2:#0040d0;--b3:#002a9a;--lt:#337cff;--ok:#2fbf71;--no:#e5484d;--bd:#cfdcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1430;--card:#16224a;--tx:#eef3ff;--bd:#2c3d78}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:14px;display:flex;flex-direction:column;gap:8px}
#top{display:none;align-items:center;gap:10px}
#bar{flex:1;height:14px;background:var(--bd);border-radius:9px;overflow:hidden}
#fill{height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .4s}
#lv{font-weight:800;font-size:13px;color:var(--b1)}
#mwrap{display:flex;align-items:flex-end;gap:6px;min-height:150px}
#mascot{width:150px;flex:none;animation:bob 2.2s ease-in-out infinite}
#mascot.big{width:190px}
@keyframes bob{50%{transform:translateY(-7px)}}
.jump{animation:jump .6s ease-out!important}
@keyframes jump{30%{transform:translateY(-28px) rotate(-5deg)}60%{transform:translateY(0) rotate(4deg)}}
.sad{animation:sad 1.2s ease-in-out!important}
@keyframes sad{20%,60%{transform:rotate(-7deg) translateY(4px)}40%,80%{transform:rotate(5deg) translateY(4px)}}
#bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px 14px;font-size:16px;line-height:1.4;min-height:64px;margin-bottom:34px}
#bubble:before{content:"";position:absolute;left:-10px;bottom:22px;border:9px solid transparent;border-right-color:var(--bd);border-left:0}
#stage{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h2{margin:0;font-size:21px}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;background:var(--b1);color:#fff;box-shadow:0 4px 0 var(--b3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--b3)}
.btn[disabled]{background:#9fb3d9;box-shadow:0 4px 0 #7f93ba;cursor:default}
.btn.alt{background:var(--card);color:var(--b1);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.opt{font:inherit;font-weight:700;font-size:17px;text-align:left;border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:13px;background:var(--card);color:var(--tx);cursor:pointer}
.opt:hover{border-color:var(--lt)}.opt.right{border-color:var(--ok);background:#2fbf7125}.opt.wrong{border-color:var(--no);background:#e5484d25;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-size:19px;font-weight:800}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px 0}
.ans{border-top:2px solid var(--bd);border-bottom:2px solid var(--bd)}
.tile{font:inherit;font-weight:700;font-size:16px;padding:9px 13px;border:2px solid var(--bd);border-bottom-width:4px;border-radius:12px;background:var(--card);color:var(--tx);cursor:pointer;animation:in .2s}
.fb{font-weight:800;min-height:22px}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat{background:var(--bg);border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:26px;color:var(--b1)}.stat span{font-size:12px}
#skip{align-self:center;opacity:.7}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg i{position:absolute;bottom:-80px;border-radius:50%;background:var(--b1);opacity:.09;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-120vh) scale(1.3)}}
#app{position:relative;z-index:1}
.btn,.opt,.tile{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:#fff8;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.ic{width:1.2em;height:1.2em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
#stage>:not(.opt){animation:in .45s backwards}
#stage>:nth-child(2){animation-delay:.08s}#stage>:nth-child(3){animation-delay:.16s}#stage>:nth-child(4){animation-delay:.24s}
.opt,.tile{transition:transform .15s,border-color .15s}.opt:hover,.tile:hover{transform:translateY(-3px) scale(1.02)}
.opt:nth-of-type(n){animation:in .4s backwards}
#fill{background:linear-gradient(90deg,var(--ok),#7aeab0,var(--ok));background-size:200%;animation:shim 2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
#st{font-weight:800;color:#ff8a1f;display:none}#st.on{display:inline-block;animation:pp .4s}
@keyframes pp{50%{transform:scale(1.4)}}
#bubble.pp{animation:pp2 .3s}@keyframes pp2{from{transform:scale(.92);opacity:.4}}
.cf{position:fixed;left:50%;top:40%;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:9;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
#mascot{cursor:pointer}.stat{animation:in .5s backwards}.stat:nth-child(2){animation-delay:.15s}.stat:nth-child(3){animation-delay:.3s}
#menu{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;gap:8px;z-index:20}
.mb{width:42px;height:42px;border-radius:13px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--b1);display:grid;place-items:center;cursor:pointer;transition:transform .15s}.mb:hover{transform:translateY(-2px)}.mb .ic{width:22px;height:22px;stroke-width:3}
body.m #app{padding-top:58px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:60vh;overflow:auto;padding:10px 0 20px}
.node{position:relative;flex:none;width:72px;height:64px;border-radius:50%;border:0;background:var(--b1);color:#fff;box-shadow:0 6px 0 var(--b3);display:grid;place-items:center;cursor:pointer}.node .ic{width:30px;height:30px}
.node.done{background:var(--ok);box-shadow:0 6px 0 #1b8a50}.node.cur{animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}.node:active{transform:translateY(4px)}
.sts{position:relative;display:flex;gap:3px;margin-top:-6px}.sts .ic{width:16px;height:16px;stroke:#c9d3ea;fill:#e3e9f6}.sts .on .ic{stroke:#e8a900;fill:#ffc933}
body.m #top{padding-right:100px}
@keyframes fl{from{transform:translateY(0) rotate(-18deg)}to{transform:translateY(125vh) rotate(24deg)}}
#top{padding-right:84px}
#menu{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:6;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--b1);cursor:pointer}
#ov{position:fixed;inset:0;z-index:20;background:#0a183a99;display:none;justify-content:center;animation:fade .25s}#ov.on{display:flex}
@keyframes fade{from{opacity:0}}
#pn{width:100%;max-width:520px;height:100%;background:var(--bg);overflow:auto;overflow-x:hidden;padding:14px 14px 40px;animation:in .3s;color:var(--tx)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nd{display:flex;flex-direction:column;align-items:center;position:relative;width:100%;margin:16px 0}
.cir{width:72px;height:64px;border-radius:50%;border:0;background:#9fb3d9;color:#fff;box-shadow:0 6px 0 #7f93ba;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.cir .ic{width:30px;height:30px}.cir:hover{transform:scale(1.08)}.cir:active{transform:translateY(4px);box-shadow:0 2px 0 #7f93ba}
.cir.dn{background:var(--ok);box-shadow:0 6px 0 #1f8f55}.cir.cur{background:var(--b1);box-shadow:0 6px 0 var(--b3);animation:pls 1.2s infinite}
@keyframes pls{50%{transform:scale(1.1)}}
.nd small{margin-top:10px;font-weight:700;opacity:.7;font-size:12px}
.sl2{position:absolute;top:0;width:78px;color:var(--b1);opacity:.3}
.stars{display:flex;gap:3px;justify-content:center;margin-top:4px}.stars .ic{width:30px;height:30px;color:#cbd5ee}.stars .ic.on{color:#ffc933;fill:#ffc933}
.sl2{opacity:1!important;width:92px;animation:bob 2.4s ease-in-out infinite}
@keyframes swp{from{opacity:0}}
#mascot{position:relative;aspect-ratio:392/353;align-self:flex-end}#mascot.big{width:220px}
#body{position:relative;transform-origin:50% 96%;animation:breathe 2.2s ease-in-out infinite}
#mimg{display:block;width:100%}
@keyframes breathe{50%{transform:scale(1.025,.97) rotate(1.2deg)}}
.lid{display:none;position:absolute;inset:0;width:100%;opacity:0;animation:lid 4s infinite}
.base .lid{display:block}
@keyframes lid{0%,93%,97%,100%{opacity:0}93.5%,96.5%{opacity:1}}
#body.dance{animation:dance 1.6s ease-in-out infinite}
@keyframes dance{25%{transform:rotate(-4deg) translateY(-3px)}50%{transform:scale(1.04,.95)}75%{transform:rotate(4deg) translateY(-3px)}}
#body.new{animation:pop .6s cubic-bezier(.3,1.6,.5,1),dance 1.6s .6s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
#fx i{position:absolute;left:50%;top:45%;width:14px;height:14px;background:#ffc933;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .8s ease-out forwards;pointer-events:none}
@keyframes spk{to{transform:translate(var(--x),var(--y)) rotate(180deg) scale(.2);opacity:0}}
.sl2{height:auto}.sl2.lock{opacity:.35!important}
#bg img{position:absolute;top:-130px;opacity:.07}
@media (prefers-reduced-motion:reduce){#mascot,#body,.lid{animation:none!important}}
</style></head>

 for(const l of story){if(id!==run)return;mood('jump');await say(l,id);await sleep(1900)}
 if(id!==run)return;mood('jump');fan();await say("Let's Go!",id);await sleep(900);if(id===run)levels()}
function levels(){mid++;look=-1;setAcc(-1);const id=++run;$('#menu').style.display='none';$('#top').style.display='none';$('#skip').style.display='none';$('#stage').style.display='flex';$('#mascot').classList.remove('big');mood('jump');
 $('#stage').innerHTML='<h2>Escolha a dificuldade</h2><button class="btn" data-l="0">'+I(P.lf)+'Fácil · 10 módulos</button><button class="btn" data-l="1">'+I(P.fl)+'Médio · 20 módulos</button><button class="btn" data-l="2">'+I(P.rk)+'Difícil · 30 módulos</button>';
 say("Qual desafio você quer enfrentar?",id);
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ok();lv=+b.dataset.l;M=MS[lv];N=M;done=[];T={s:0,h:0,e:0,r:0};startModule(0,R(L.lv[lv]))})}
function startModule(k,pre=''){mid++;run++;m=k;qi=0;hits=errs=rec=0;miss=[];retry=false;st=0;pop();t0=Date.now();const th=TH[m%8];
 $('#top').style.display='flex';$('#menu').style.display='flex';$('#stage').style.display='flex';$('#lv').textContent='Módulo '+(m+1)+'/'+M;$('#mascot').classList.remove('big');mood('jump');
 say((pre?pre+' ':'')+th.n+' '+RM[m/8|0]+'. '+th.i);show(1)}
function gen(){const tier=Math.min(4,lv+Math.floor(st/3)+Math.floor(m*3/M)),th=TH[m%8];
 if(tier<2)return{k:'c',tier,w:R(m>=8&&Math.random()<.35?R(TH).w:th.w),rev:tier===1};
 const n=R(th.w),sj=R([["Eu",0,"I"],["Você",1,"You"]]),vb=R(th.v),en=sj[2]+' '+vb[2]+' the '+n[1],ws=en.split(' ');
 return{k:'b',tier,en,pt:sj[0]+' '+vb[sj[1]]+' '+n[2]+' '+n[0],ex:sh([...ALL.map(a=>a[1]),'is','a','and','my','we','they']).filter(x=>!ws.includes(x)).slice(0,[0,0,0,2,4][tier])}}
function prog(){$('#fill').style.width=Math.min(qi,N)/N*100+'%'}
function show(first){prog();let x;
 if(!retry){if(qi>=N){if(!miss.length)return fin();retry=true;rq=miss.slice();ri=0;first=1;say(R(L.ri))}else x=gen()}
 if(retry){if(ri>=rq.length)return fin();x=rq[ri];if(!ri)first=1}
 x.k==='c'?choose(x,first):build(x,first)}
function after(g,a,x){const f=$('.fb');f.className='fb '+(g?'ok':'no');
 if(g){st++;pop();ok();setAcc(++look);mood('jump');f.innerHTML=I(P.ck)+' Correto!';boom(12)}else{st=0;pop();bad();mood('sad');f.textContent='Resposta: '+a}
 if(!retry){g?hits++:(errs++,miss.push(x))}else if(g)rec++;
 let t=retry?R(g?L.ro:L.rn):g?(st&&st%3==0?R(L.sk):R(L.ok)):(x.tier>2&&Math.random()<.5?R(L.nh):R(L.no));
 if(!retry&&N-qi-1===2)t+=' '+R(L.near);say(t);
 const id=mid;setTimeout(()=>{if(id!==mid)return;retry?ri++:qi++;show()},g?1300:2600)}
function choose(x,first){const[p,e]=x.w,q=x.rev?e:p,a=x.rev?p:e,k=x.rev?0:1;
 const o=sh([a,...sh(ALL.filter(w=>w[k]!==a)).slice(0,3).map(w=>w[k])]);
 $('#stage').innerHTML='<div class="q">'+(x.rev?'O que significa':'Como se diz')+' “'+cap(q)+'” '+(x.rev?'em português?':'em inglês?')+'</div>'+o.map(t=>'<button class="opt">'+cap(t)+'</button>').join('')+'<div class="fb"></div>';
 if(!first)say(F(R(L.ask[x.tier]),{p:cap(p),e:cap(e)}));let lk=0;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lk)return;lk=1;document.querySelectorAll('.opt').forEach(z=>{if(z.textContent===cap(a))z.classList.add('right')});
  const g=b.textContent===cap(a);if(!g)b.classList.add('wrong');after(g,cap(a),x)})}
function build(x,first){const tiles=sh([...x.en.split(' '),...x.ex]);
 $('#stage').innerHTML='<div class="q">Traduza: “'+x.pt+'”</div><div class="ans"></div><div class="bank"></div><div class="fb"></div><button class="btn" id="chk" disabled>Verificar</button>';
 if(!first)say(R(L.ask[x.tier]));const A=$('.ans'),B=$('.bank'),C=$('#chk');
 tiles.forEach(t=>{const b=document.createElement('button');b.className='tile';b.textContent=t;b.onclick=()=>{tick();(b.parentNode===B?A:B).append(b);C.disabled=!A.children.length};B.append(b)});
 C.onclick=()=>{const g=[...A.children].map(z=>z.textContent).join(' ')===x.en;document.querySelectorAll('.tile').forEach(z=>z.onclick=null);C.remove();after(g,x.en,x)}}
const stars=n=>'<div class="stars">'+[1,2,3].map(k=>I(P.st).replace('class="ic"','class="ic'+(k<=n?' on':'')+'"')).join('')+'</div>';
function fin(){prog();fan();boom(50);mood('jump');const s=Math.round((Date.now()-t0)/1000);T.s+=s;T.h+=hits;T.e+=errs;T.r+=rec;
 const acc=Math.round(hits/N*100),sr=acc>=90?3:acc>=60?2:1,last=m>=M-1;done[m]=Math.max(done[m]||0,sr);
 $('#top').style.display='none';$('#mascot').classList.add('big');const v=last?T:{s,h:hits,e:errs,r:rec};
 $('#stage').innerHTML='<h2>'+I(P.tr)+(last?' Jornada concluída!':' Módulo '+(m+1)+' concluído!')+'</h2>'+stars(sr)+'<div>'+LN[lv]+' · '+TH[m%8].n+' '+RM[m/8|0]+' · Aproveitamento: <b>'+acc+'%</b></div><div class="stats"><div class="stat"><b>'+I(P.cl)+' '+fmt(v.s)+'</b><span>tempo</span></div><div class="stat"><b style="color:var(--ok)" data-n="'+v.h+'">0</b><span>acertos</span></div><div class="stat"><b style="color:var(--no)" data-n="'+v.e+'">0</b><span>erros</span></div></div><div>Recuperadas na revisão: <b>'+v.r+'</b></div><div class="row">'+(last?'<button class="btn" id="nx">Jogar de novo</button>':'<button class="btn" id="nx">Próximo módulo</button>')+'<button class="btn alt" id="mp">'+I(P.mp)+' Módulos</button></div>';
 say(last?R(L.fn):R(L.d[acc>=90?2:acc>=60?1:0]));cnt();
 $('#nx').onclick=()=>{ok();last?levels():startModule(m+1)};$('#mp').onclick=openMenu}
function openMenu(){let h='';for(let k=0;k<M;k++){const sn=Math.sin(k*.95),c=done[k]?'dn':k===m?'cur':'';
 h+='<div class="nd" style="transform:translateX('+Math.round(sn*78)+'px)">'+(k%3==2?'<img alt="" class="sl2'+(done[k]?'':' lock')+'" style="'+(sn>0?'left:-92px':'right:-92px')+'" src="'+(done[k]?IMG.looks:IMG.sil.slice(1))[(k/3|0)%14]+'">':'')+'<button class="cir '+c+'" data-k="'+k+'">'+I(done[k]?P.ck:k===m?P.st:P.bk,2.6)+'</button><small>'+TH[k%8].n+' '+RM[k/8|0]+'</small>'+(done[k]?stars(done[k]):'')+'</div>'}
 $('#path').innerHTML=h;$('#ov').classList.add('on');ok();const c=$('.cir.cur');if(c)c.scrollIntoView({block:'center'})}
const closeMenu=()=>$('#ov').classList.remove('on');
$('#menu').onclick=openMenu;$('#cx').onclick=closeMenu;
$('#ov').onclick=e=>{if(e.target.id==='ov')closeMenu()};
$('#chg').onclick=()=>{closeMenu();levels()};
$('#path').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=+b.dataset.k;closeMenu();startModule(k,F(R(L.jp),{n:k+1}))};
const I=(d,w)=>'<svg class="ic" viewBox="0 0 24 24"'+(w?' style="stroke-width:'+w+'"':'')+'><path d="'+d+'"/></svg>';
const P={st:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",bk:"M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z",mp:"M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14",dt:"M5 12h.01M12 12h.01M19 12h.01",x:"M6 6l12 12M18 6L6 18",st:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",bk:"M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v13",dt:"M12 5v.01M12 12v.01M12 19v.01",mp:"M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14",lf:"M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l7-7",fl:"M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z",rk:"M12 2c4 3 5 8 4 13H8c-1-5 0-10 4-13zM8 15l-3 4 4-1M16 15l3 4-4-1",tr:"M7 4h10v5a5 5 0 0 1-10 0zM7 6H4c0 3 1 4 3 4M17 6h3c0 3-1 4-3 4M12 14v4M8 21h8",cl:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",ck:"M5 13l4 4 10-10"};
function pop(){const e=$('#st');e.className='';void e.offsetWidth;e.innerHTML=st>1?I(P.fl)+' '+st:'';e.className=st>1?'on':''}
function boom(n=26){const c=['#0f5ff0','#337cff','#2fbf71','#ffc933','#fff'];for(let k=0;k<n;k++){const d=document.createElement('i');d.className='cf';d.style.background=c[k%5];d.style.setProperty('--x',(Math.random()*340-170)+'px');d.style.setProperty('--y',(Math.random()*300-120)+'px');document.body.append(d);setTimeout(()=>d.remove(),1200)}}
function cnt(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n;let k=0;if(!n)return e.textContent=0;const t=setInterval(()=>{e.textContent=++k;tick();if(k>=n)clearInterval(t)},110)})}
for(let k=0;k<9;k++){const d=new Image();d.alt='';d.src=IMG.sil[k*2%IMG.sil.length];d.style.cssText=`width:${60+Math.random()*80}px;left:${Math.random()*85}%;animation:fl ${16+Math.random()*16}s linear ${-Math.random()*20}s infinite`;$('#bg').append(d)}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.opt,.tile');if(!b)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,d=document.createElement('span');d.className='rp';d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.append(d);setTimeout(()=>d.remove(),600)});
$('#mascot').onclick=()=>{if($('#skip').style.display==='block'||!ac)return;mood('jump');snd(700,.1,'square',.03);snd(950,.1,'square',.03,.1);say(sh(["Cócegas! Hihi!","Vamos aprender mais?","Estou aqui com você!","Ei, não pare agora!"])[0])};
$('#menu').innerHTML=I(P.dt,4)+I(P.mp);$('#cx').innerHTML=I(P.x);
start();
